name: Actualizar Datos Estación Cerro Negro

on:
  schedule:
    # Se ejecuta cada 2 horas a los 20 minutos (las estaciones satelitales transmiten cada hora)
    - cron: '20 */2 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy playwright openpyxl

      - name: Instalar navegador Chromium para Playwright
        run: |
          python -m playwright install --with-deps chromium

      - name: Descargar y procesar datos de Cerro Negro
        run: |
          python actualizar_datos.py

      - name: Guardar y sincronizar cambios en el repositorio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          git add cerro_negro_datos.csv clima_actual.json resumen_datos.json
          git commit -m "Auto: actualización datos climáticos Cerro Negro [$(date -u +'%Y-%m-%d %H:%M UTC')]" || echo "No hay cambios para commitear"
          
          git pull --rebase --autostash origin main || true
          git push origin main
